<!doctype html>
<meta charset="utf-8">
<title>running</title>
<body>
<iframe id="f" src="./" width="1440" height="900"></iframe>
<script type="module">
  import { APPS } from "./assets/data.js";
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const f = document.getElementById("f");
  const log = [];
  const ok = (name, cond) => log.push(`${cond ? "PASS" : "FAIL"} ${name}`);
  await new Promise((r) => (f.onload = r));
  await wait(800);
  const w = f.contentWindow, d = f.contentDocument;
  const vis = (id) => !d.getElementById(`win-${id}`).hidden;

  ok("About and Apps open on first paint", vis("about") && vis("apps"));
  ok("address bar untouched on first paint", w.location.hash === "");
  ok("20 apps in the Apps window", d.querySelectorAll("#win-apps [data-app]").length === 20);

  d.querySelector('[data-dock="security"]').click(); await wait(400);
  ok("dock opens Security", vis("security"));
  ok("address bar follows (#security)", w.location.hash === "#security");
  ok("dock shows open state", d.querySelector('[data-dock="security"]').classList.contains("is-open"));

  d.querySelector('[data-dock="terminal"]').click(); await wait(400);
  const inp = d.getElementById("term-input");
  inp.value = "help"; inp.form.requestSubmit(); await wait(50);
  ok("terminal help prints commands", d.querySelector(".term-out").textContent.includes("list shipped apps"));
  inp.value = "open var66"; inp.form.requestSubmit(); await wait(400);
  ok("terminal 'open var66' shows the VAR66 page", d.querySelector("#win-apps .detail-name")?.textContent === "VAR66");
  ok("address bar shows #app/var66", w.location.hash === "#app/var66");
  inp.value = "nonsense"; inp.form.requestSubmit(); await wait(50);
  ok("unknown command handled", d.querySelector(".term-out").textContent.includes("command not found: nonsense"));

  w.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape" })); await wait(50);
  ok("Esc closes the top window (Apps)", !vis("apps"));

  const before = d.documentElement.dataset.theme;
  d.getElementById("theme-toggle").click();
  ok("theme toggles", d.documentElement.dataset.theme !== before);
  d.getElementById("theme-toggle").click();

  d.querySelector('[data-dock="apps"]').click(); await wait(400);
  ok("dock Apps resets to the grid", d.querySelectorAll("#win-apps [data-app]").length === 20);
  d.querySelector('#win-apps [data-tab="web"]').click(); await wait(50);
  ok("Websites tab shows 4 sites", d.querySelectorAll("#win-apps .site-card").length === 4);
  ok("address bar shows #apps/websites", w.location.hash === "#apps/websites");

  d.querySelector("#win-security .win-close").click(); await wait(50);
  ok("close button closes Security", !vis("security"));

  d.querySelector('[data-dock="experience"]').click(); await wait(50);
  ok("Experience lists certificates", d.querySelectorAll("#win-experience .xp-row").length >= 5);

  w.location.hash = "#contact"; await wait(400);
  ok("deep link #contact opens Contact", vis("contact"));

  const urls = APPS.flatMap((a) => [`assets/apps/${a.id}.webp`, ...[1, 2, 3].map((n) => `assets/shots/${a.id}-${n}.webp`)])
    .concat(["assets/web/pbtc.webp", "assets/web/manyrooms.webp", "assets/web/salabed.webp", "assets/web/kickoffweb.webp",
             "assets/me.webp", "assets/icons.svg", "assets/favicon.svg", "assets/fonts/geist.woff2", "assets/fonts/geist-mono.woff2", "cv.html"]);
  const missing = [];
  for (const u of urls) if (!(await fetch(u, { method: "HEAD" })).ok) missing.push(u);
  ok(`all ${urls.length} assets load${missing.length ? ": missing " + missing.join(", ") : ""}`, !missing.length);

  document.title = log.every((l) => l.startsWith("PASS")) ? "ALL PASS" : "FAILURES";
  document.body.insertAdjacentHTML("beforeend", `<pre id="out">${log.join("\n")}</pre>`);
</script>
